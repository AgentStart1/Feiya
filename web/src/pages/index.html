<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手机共享 · Feiya</title>
    <link rel="stylesheet" href="/web/style.css" />
    <script type="module" src="/web/app.js"></script>
  </head>
  <body data-page="files" class="files">
    <a class="skip-link" href="#main">跳至内容</a>
    <aside class="sidebar">
      <a class="brand" href="/">Feiya</a>
      <p class="tagline">让分享更简单</p>
      <nav class="nav" aria-label="主导航">
        <a href="/" aria-current="page"
          ><span class="icon icon-file" aria-hidden="true"></span>文件</a
        ><a href="/messages"
          ><span class="icon icon-chat" aria-hidden="true"></span>消息</a
        >
      </nav>
      <div
        class="connection"
        id="connection"
        data-status="connecting"
        role="status"
      >
        <div class="connection-title">
          <span class="icon icon-status" aria-hidden="true"></span
          ><span id="connection-label">正在连接</span>
        </div>
        <small>保持手机服务开启</small>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">手机共享</header>
      <main id="main" class="content">
        <div class="heading">
          <h1>手机共享</h1>
          <span class="count" id="count">正在加载</span>
        </div>
        <div class="notice" id="file-notice" role="status">
          <h2>正在获取共享文件</h2>
          <p>请稍候…</p>
        </div>
        <button class="button" id="retry-files" hidden>重新加载</button>
        <table class="file-table" id="file-table" hidden>
          <caption class="sr-only">
            手机共享文件，选择下载以保存到本机
          </caption>
          <thead>
            <tr>
              <th scope="col">文件名称</th>
              <th scope="col">类型</th>
              <th scope="col">下载</th>
            </tr>
          </thead>
          <tbody id="shares"></tbody>
        </table>
      </main>
      <footer class="footer">文件由手机端管理。</footer>
    </div>
  </body>
</html>
